[package]
name = "omaview"
version = "0.1.0"
edition = "2024"
authors = ["Omarchy Community"]
description = "Dead-simple, theme-aware image viewer for Omarchy Linux under Hyprland"
license = "MIT"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_16"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
gio = "0.22"
glib = "0.22"
gdk4 = "0.11"
cairo-rs = { version = "0.22", features = ["png"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
notify = "6.1"
kamadak-exif = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
