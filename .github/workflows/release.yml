name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            arch_name: x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            arch_name: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip binary
        run: strip target/release/omaview

      - name: Package Release Assets
        run: |
          ARCH="${{ matrix.arch_name }}"
          PKG_NAME="omaview-${ARCH}-linux"
          DIST_DIR="dist/${PKG_NAME}"
          mkdir -p "${DIST_DIR}/icons"

          cp target/release/omaview "${DIST_DIR}/"
          cp data/omaview.desktop "${DIST_DIR}/"
          cp data/icons/hicolor/scalable/apps/omaview.svg "${DIST_DIR}/icons/"
          cp data/icons/hicolor/scalable/apps/omaview.png "${DIST_DIR}/icons/"
          cp README.md "${DIST_DIR}/"

          cat << 'EOF' > "${DIST_DIR}/install.sh"
          #!/bin/sh
          set -e
          BIN_DIR="${HOME}/.local/bin"
          APP_DIR="${HOME}/.local/share/applications"
          ICON_DIR="${HOME}/.local/share/icons/hicolor/scalable/apps"
          mkdir -p "$BIN_DIR" "$APP_DIR" "$ICON_DIR"
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          install -Dm755 "$SCRIPT_DIR/omaview" "$BIN_DIR/omaview"
          install -Dm644 "$SCRIPT_DIR/omaview.desktop" "$APP_DIR/omaview.desktop"
          install -Dm644 "$SCRIPT_DIR/icons/omaview.svg" "$ICON_DIR/omaview.svg"
          install -Dm644 "$SCRIPT_DIR/icons/omaview.png" "$ICON_DIR/omaview.png"
          echo "Omaview successfully installed to $BIN_DIR/omaview"
          EOF
          chmod +x "${DIST_DIR}/install.sh"

          cd dist
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omaview-${{ matrix.arch_name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Prepare Release Files
        run: |
          mkdir -p release_assets
          find dist-all -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release_assets/ \;
          cd release_assets
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*.tar.gz
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
